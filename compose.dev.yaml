services:
  db:
    image: postgres:16
    container_name: rugen_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: language_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db_init_v1.sql:/docker-entrypoint-initdb.d/001_v1_core.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d language_db"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: rugen_app
    working_dir: /app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/language_db_test?sslmode=disable
      PORT: "8080"
    volumes:
      - ./:/app
    ports:
      - "8080:8080"
    command: go run .

volumes:
  pgdata: