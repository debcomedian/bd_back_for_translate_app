<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Language-DB Admin</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    :root{ --fs-mult:1; font-size:calc(16px*var(--fs-mult)); transition:.1s }
    body{padding:1rem}
    thead th{position:sticky;top:0;background:#f8f9fa;cursor:pointer}
    .table-wrapper{max-height:45vh;overflow:auto}
    #jsonInput,#sqlInput{height:11rem}
    #log{height:7rem;overflow:auto;font-size:.85rem}
    #zoomBlock{position:absolute;top:0;right:0;padding:.5rem;background:#f8f9fa;border-radius:0 0 0 .5rem}
  </style>
</head>
<body>

<h1 class="h4 mb-3">Администрирование БД</h1>

<!-- панель масштаб + logout -->
<div id="zoomBlock" class="d-flex align-items-center gap-2" style="display:none">
  <label class="mb-0">Масштаб:</label>
  <select id="zoomSelect" class="form-select form-select-sm w-auto"></select>
  <button id="btnLogout" class="btn btn-outline-secondary btn-sm">Выйти</button>
</div>

<!-- основной UI -->
<div id="mainUI" style="display:none">
  <div class="row gy-2">
    <div class="col-sm-4">
      <label class="form-label">Таблица</label>
      <select id="tableSelect" class="form-select"></select>
    </div>
    <div class="col-sm-4">
      <label class="form-label">Режим ввода</label>
      <select id="modeSelect" class="form-select">
        <option value="json">JSON</option>
        <option value="form">Форма</option>
        <option value="sql">SQL</option>
      </select>
    </div>
    <div class="col-sm-2 d-grid">
      <button id="btnDeleteSel" class="btn btn-danger mt-lg-4" disabled>Удалить запись</button>
    </div>
  </div>

  <!-- grid -->
  <div class="table-wrapper border mt-3">
    <table id="dataTable" class="table table-sm table-striped table-hover mb-0">
      <thead><tr id="thead"></tr></thead><tbody id="tbody"></tbody>
    </table>
  </div>

  <!-- FK -->
  <div id="fkBlock" class="alert alert-secondary d-none mt-3 p-2"></div>

  <!-- JSON -->
  <div id="jsonPane" class="mt-3">
    <label class="form-label">JSON-объект или массив</label>
    <textarea id="jsonInput" class="form-control" placeholder='{"id":1,"name":"…"}'></textarea>
  </div>

  <!-- SQL -->
  <div id="sqlPane" class="mt-3 d-none">
    <label class="form-label">SQL-команда (INSERT / UPDATE / DELETE)</label>
    <textarea id="sqlInput" class="form-control" placeholder="INSERT INTO words …"></textarea>
  </div>

  <!-- Форма -->
  <div id="formPane" class="mt-3 d-none">
    <div class="row gy-2">
      <div class="col-sm-3">
        <label class="form-label">Операция</label>
        <select id="crudSelect" class="form-select">
          <option value="create">Создание</option>
          <option value="update">Обновление</option>
        </select>
      </div>
      <div id="idSelBlock" class="col-sm-3 d-none">
        <label class="form-label">ID записи</label>
        <select id="idSelect" class="form-select"><option value="">Выберите…</option></select>
      </div>
    </div>
    <form id="dynForm" class="row gy-2 mt-2"></form>
  </div>

  <div class="mt-3 d-flex gap-2">
    <button id="btnRun"   class="btn btn-success">Выполнить</button>
    <button id="btnClear" class="btn btn-outline-secondary">Очистить</button>
  </div>

  <div class="mt-4">
    <label class="form-label">Журнал</label>
    <pre id="log" class="border rounded p-2 bg-light"></pre>
  </div>
</div><!--/mainUI-->

<!-- login -->
<div class="modal fade" id="loginModal" tabindex="-1" data-bs-backdrop="static">
  <div class="modal-dialog"><div class="modal-content">
    <form id="loginForm">
      <div class="modal-header"><h5 class="modal-title">Авторизация</h5></div>
      <div class="modal-body">
        <input name="login" class="form-control mb-2" placeholder="Логин" autocomplete="username" required>
        <input name="password" type="password" class="form-control" placeholder="Пароль" autocomplete="current-password" required>
        <div id="loginErr" class="alert alert-danger d-none mt-2">Неверные данные</div>
      </div>
      <div class="modal-footer"><button class="btn btn-primary w-100">Войти</button></div>
    </form>
  </div></div>
</div>

<div class="toast-container position-fixed top-0 end-0 p-3">
  <div id="errToast" class="toast text-bg-danger" data-bs-delay="6000"><div class="toast-body"></div></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/axios@1.4.0/dist/axios.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
(function(){
  const $=id=>document.getElementById(id);
  const toast=new bootstrap.Toast($('errToast'));
  const loginM=new bootstrap.Modal($('loginModal'));
  const log=t=>$('log').textContent+=`[${new Date().toLocaleTimeString()}] ${t}\n`;

  /* zoom */
  for(let z=0.5;z<=2.01;z+=0.1){
    $('zoomSelect').insertAdjacentHTML('beforeend',`<option value="${z.toFixed(1)}">${(z*100).toFixed(0)}%</option>`);
  }
  const applyZoom=v=>{document.documentElement.style.setProperty('--fs-mult',v);localStorage.setItem('zoom',v);}
  applyZoom(localStorage.getItem('zoom')||'1.0');
  $('zoomSelect').value=localStorage.getItem('zoom')||'1.0';
  $('zoomSelect').onchange=e=>applyZoom(e.target.value);

  /* auth */
  const TOK='langdb_jwt';
  const setTok=t=>{
    t?(localStorage.setItem(TOK,t),axios.defaults.headers.common.Authorization='Bearer '+t)
     :(localStorage.removeItem(TOK),delete axios.defaults.headers.common.Authorization);
  };
  const logout=()=>{setTok(null);$('mainUI').style.display='none';$('zoomBlock').style.display='none';loginM.show();};
  $('btnLogout').onclick=logout;
  $('loginForm').onsubmit=async e=>{
    e.preventDefault();
    try{
      const fd=new FormData(e.target);
      const {data}=await axios.post('/auth/login',{login:fd.get('login'),password:fd.get('password')});
      setTok(data.token);loginM.hide();$('mainUI').style.display='';$('zoomBlock').style.display='';initUI();
    }catch{$('loginErr').classList.remove('d-none');}
  };
  axios.interceptors.response.use(r=>r,e=>{
    const m=e?.response?.data?.error||e.message;
    $('errToast').querySelector('.toast-body').textContent=m;toast.show();log('ERROR: '+m);
    if([401,403].includes(e?.response?.status))logout();
    return Promise.reject(e);
  });

  /* state */
  let tbl='',rows=[],meta=[],fkeys=[],serialPk=false;

  /* grid */
  const drawGrid=()=>{
    $('thead').innerHTML='';$('tbody').innerHTML='';
    const cols=rows.length?Object.keys(rows[0]):meta.map(m=>m.column);   /** FIX #1 */
    if(!cols.length) return;
    cols.forEach(c=>{
      $('thead').insertAdjacentHTML('beforeend',`<th>${c}</th>`);
      $('thead').lastChild.onclick=()=>{rows.sort((a,b)=>(a[c]>b[c]?1:-1));drawGrid();};
    });
    rows.forEach(r=>{
      const tr=document.createElement('tr');tr.dataset.id=r.id??'';
      tr.onclick=()=>{[...$('tbody').children].forEach(x=>x.classList.remove('table-primary'));tr.classList.add('table-primary');$('btnDeleteSel').disabled=!tr.dataset.id;};
      cols.forEach(c=>tr.insertAdjacentHTML('beforeend',`<td>${r[c]??''}</td>`));
      $('tbody').appendChild(tr);
    });
  };
  const reload=async()=>{rows=(await axios.get('/admin/'+tbl)).data;drawGrid();};

  /* FK / meta / form */
  const showFK=()=>{
    const blk=$('fkBlock');
    if(!fkeys.length){blk.classList.add('d-none');return;}
    blk.classList.remove('d-none');
    const p=fkeys[0].parent;
    blk.innerHTML='<strong>Зависимость от “'+p+'”</strong><br>'+
      fkeys.map(x=>`<code>${x.child_col}</code> → <code>${p}.${x.parent_col}</code>`).join(', ');
  };
  const buildForm=()=>{
    const form=$('dynForm');form.innerHTML='';
    meta.forEach(c=>{
      const isFK=fkeys.some(f=>f.child_col===c.column);
      if(isFK){
        form.insertAdjacentHTML('beforeend',`
          <div class="col-sm-4">
            <label class="form-label">${c.column}</label>
            <select name="${c.column}" class="form-select"><option value="">—</option></select>
          </div>`);
      }else{
        form.insertAdjacentHTML('beforeend',`
          <div class="col-sm-4">
            <label class="form-label">${c.column}</label>
            <input name="${c.column}" class="form-control"
                   ${c.column==='id'&&serialPk?'disabled placeholder="SERIAL"':''}
                   ${c.nullable==='NO'&&c.column!=='id'?'required':''}>
          </div>`);
      }
    });
  };
  const fillFKInputs=async()=>{
    for(const fk of fkeys){
      const sel=$('dynForm').elements[fk.child_col];
      if(!sel) continue;
      const ids=(await axios.get('/admin/rowids?table='+fk.parent)).data;
      sel.innerHTML='<option value="">—</option>'+ids.map(i=>`<option>${i}</option>`).join('');
    }
  };
  const loadFK=async()=>{fkeys=(await axios.get('/admin/fkeys?table='+tbl)).data;showFK();};
  const loadMeta=async()=>{
    meta=(await axios.get('/admin/schema')).data.filter(m=>m.table===tbl);
    serialPk=meta.some(m=>m.column==='id'&&m.type==='integer');
    buildForm();await fillFKInputs();
  };

  /* id-list & autofill */
  const fillIdList=async()=>{
    const ids=(await axios.get('/admin/rowids?table='+tbl)).data;
    $('idSelect').innerHTML='<option value="">Выберите…</option>'+ids.map(i=>`<option>${i}</option>`).join('');
  };
  $('idSelect').onchange=e=>{
    const id=e.target.value;const f=$('dynForm');
    [...f.elements].forEach(el=>/INPUT|SELECT/.test(el.tagName)&&(el.value=''));
    if(!id) return;
    const rec=rows.find(r=>String(r.id)===id);
    if(!rec) return;
    for(const [k,v] of Object.entries(rec)){const el=f.elements[k];if(el)el.value=v;}
  };

  /* CRUD helpers */
  const execJSON=m=>axios[m]('/admin/'+tbl,JSON.parse($('jsonInput').value||'{}'));
  const execSQL =()=>axios.post('/admin/sql',{sql:$('sqlInput').value});
  const execFORM=async()=>{
    const body=Object.fromEntries(new FormData($('dynForm')));
    if($('crudSelect').value==='create')await axios.post('/admin/'+tbl,body);
    else await axios.put('/admin/'+tbl,{...body,id:$('idSelect').value});
  };

  /* UI handlers */
  $('tableSelect').onchange=async e=>{
    tbl=e.target.value;
    $('dynForm').reset();$('idSelect').value='';                 /** FIX #2 */
    await loadFK();            // 1
    await loadMeta();          // 2
    await reload();            // 3
    await fillIdList();        // 4
  };
  $('modeSelect').onchange=e=>{
    const m=e.target.value;['json','form','sql'].forEach(p=>$(`${p}Pane`).classList.toggle('d-none',p!==m));
    $('btnRun').textContent=m==='sql'?'Выполнить SQL':'Выполнить';
  };
  $('crudSelect').onchange=e=>{
    const upd=e.target.value==='update';
    $('idSelBlock').classList.toggle('d-none',!upd);
    $('dynForm').reset();if(!upd)$('idSelect').value='';
  };
  $('btnRun').onclick=async()=>{
    try{
      if($('modeSelect').value==='json')await execJSON('post');
      else if($('modeSelect').value==='sql')await execSQL();
      else await execFORM();
      await reload();['jsonInput','sqlInput'].forEach(id=>$(id).value='');
      log('Операция выполнена');if($('crudSelect').value==='update')await fillIdList();
    }catch{}
  };
  $('btnClear').onclick=()=>{['jsonInput','sqlInput'].forEach(id=>$(id).value='');$('dynForm').reset();};
  $('btnDeleteSel').onclick=async()=>{
    const id=[...$('tbody').querySelectorAll('.table-primary')][0]?.dataset.id;
    if(!id||!confirm('Удалить ID='+id+'?'))return;
    await axios.delete(`/admin/${tbl}?id=${id}`);await reload();log('Удалено ID='+id);
  };

  /* init */
  const initUI=async()=>{
    const {data:t}=await axios.get('/admin/tables');
    $('tableSelect').innerHTML=t.map(x=>`<option>${x}</option>`).join('');
    tbl=t[0]||'';await $('tableSelect').dispatchEvent(new Event('change'));
  };

  /* first run */
  const tok=localStorage.getItem(TOK);
  if(tok){setTok(tok);$('mainUI').style.display='';$('zoomBlock').style.display='';initUI();}
  else loginM.show();
})();
</script>
</body>
</html>
